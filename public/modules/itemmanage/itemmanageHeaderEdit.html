<form id="itemmanageHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="itemmanageHeaderEdit-obj_itemmanage_id">

	<!-- Textbox: itemmanage_id-->	
	<div id="itemmanageHeaderEdit-obj_itemmanage_id-container" class="input-field" field="itemmanageHeaderEdit-obj_itemmanage_id">
		<label for="itemmanageHeaderEdit-obj_itemmanage_id">ID</label>
		<input id="itemmanageHeaderEdit-obj_itemmanage_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="itemmanage_id"
			data-tabindex="1" 
			required 
			invalid-message-required="ID harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: itemmanage_name-->	
	<div id="itemmanageHeaderEdit-obj_itemmanage_name-container" class="input-field" field="itemmanageHeaderEdit-obj_itemmanage_name">
		<label for="itemmanageHeaderEdit-obj_itemmanage_name">Name</label>
		<input id="itemmanageHeaderEdit-obj_itemmanage_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="itemmanage_name"
			data-tabindex="2" 
			character-case="uppercase" 
			required 
			invalid-message-required="nama itemmanage harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>
	
</form>
