<form id="taxmodelHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="taxmodelHeaderEdit-obj_taxmodel_id">

	<!-- Textbox: taxmodel_id-->	
	<div id="taxmodelHeaderEdit-obj_taxmodel_id-container" class="input-field" field="taxmodelHeaderEdit-obj_taxmodel_id">
		<label for="taxmodelHeaderEdit-obj_taxmodel_id">ID</label>
		<input id="taxmodelHeaderEdit-obj_taxmodel_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="taxmodel_id"
			data-tabindex="1" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: taxmodel_name-->	
	<div id="taxmodelHeaderEdit-obj_taxmodel_name-container" class="input-field" field="taxmodelHeaderEdit-obj_taxmodel_name">
		<label for="taxmodelHeaderEdit-obj_taxmodel_name">Name</label>
		<input id="taxmodelHeaderEdit-obj_taxmodel_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="taxmodel_name"
			data-tabindex="2" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: taxmodel_formula-->	
	<div id="taxmodelHeaderEdit-obj_taxmodel_formula-container" class="input-field" field="taxmodelHeaderEdit-obj_taxmodel_formula">
		<label for="taxmodelHeaderEdit-obj_taxmodel_formula">Formula</label>
		<input id="taxmodelHeaderEdit-obj_taxmodel_formula"  fgta5-component="Textbox" placeholder="formula" autocomplete="off" spellcheck="false" 
			binding="taxmodel_formula"
			data-tabindex="3" 
			character-case="uppercase" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Numberbox: taxmodel_value-->	
	<div id="taxmodelHeaderEdit-obj_taxmodel_value-container" class="input-field" field="taxmodelHeaderEdit-obj_taxmodel_value">
		<label for="taxmodelHeaderEdit-obj_taxmodel_value">Value</label>
		<input id="taxmodelHeaderEdit-obj_taxmodel_value"  fgta5-component="Numberbox" placeholder="value" autocomplete="off" spellcheck="false" 
			binding="taxmodel_value"
			value="0" 
			data-tabindex="4" 
			maxlength="5" 
		>
	</div>
	
</form>
