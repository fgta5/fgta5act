<form id="paymreqHeaderEdit-frm" class="module-form" locked="true" autoid="true" primarykey="paymreqHeaderEdit-obj_paymreq_id">

	<!-- Textbox: paymreq_id-->	
	<div id="paymreqHeaderEdit-obj_paymreq_id-container" class="input-field hidden" field="paymreqHeaderEdit-obj_paymreq_id">
		<label for="paymreqHeaderEdit-obj_paymreq_id">ID</label>
		<input id="paymreqHeaderEdit-obj_paymreq_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="paymreq_id"
			data-tabindex="1" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: paymreq_doc-->	
	<div id="paymreqHeaderEdit-obj_paymreq_doc-container" class="input-field" field="paymreqHeaderEdit-obj_paymreq_doc">
		<label for="paymreqHeaderEdit-obj_paymreq_doc">ID</label>
		<input id="paymreqHeaderEdit-obj_paymreq_doc"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="paymreq_doc"
			data-tabindex="2" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
			disabled 
		>
	</div>


	<!-- Datepicker: paymreq_date-->	
	<div id="paymreqHeaderEdit-obj_paymreq_date-container" class="input-field" field="paymreqHeaderEdit-obj_paymreq_date">
		<label for="paymreqHeaderEdit-obj_paymreq_date">Date</label>
		<input id="paymreqHeaderEdit-obj_paymreq_date"  fgta5-component="Datepicker" placeholder="date" autocomplete="off" spellcheck="false" 
			binding="paymreq_date"
			data-tabindex="3" 
		>
	</div>


	<!-- Datepicker: paymreq_datedue-->	
	<div id="paymreqHeaderEdit-obj_paymreq_datedue-container" class="input-field" field="paymreqHeaderEdit-obj_paymreq_datedue">
		<label for="paymreqHeaderEdit-obj_paymreq_datedue">Due Date</label>
		<input id="paymreqHeaderEdit-obj_paymreq_datedue"  fgta5-component="Datepicker" placeholder="due date" autocomplete="off" spellcheck="false" 
			binding="paymreq_datedue"
			data-tabindex="4" 
		>
	</div>


	<!-- Textbox: paymreq_descr-->	
	<div id="paymreqHeaderEdit-obj_paymreq_descr-container" class="input-field" field="paymreqHeaderEdit-obj_paymreq_descr">
		<label for="paymreqHeaderEdit-obj_paymreq_descr">Descr</label>
		<input id="paymreqHeaderEdit-obj_paymreq_descr"  fgta5-component="Textbox" placeholder="descr" autocomplete="off" spellcheck="false" 
			binding="paymreq_descr"
			data-tabindex="5" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>
	
</form>
