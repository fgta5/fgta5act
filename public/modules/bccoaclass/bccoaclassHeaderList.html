			<th data-name="bccoaclass_name" binding="bccoaclass_name" >Name</th>
		</tr>
	</thead>
</table>



<div class="footer-buttons-container">
	<div></div>
	<div>
		<button id="bccoaclassHeaderList-btn_new" data-action="bccoaclassHeader-new" data-sectionsource="bccoaclassHeaderList-section">New</button>
