<form id="bccoaclassHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="bccoaclassHeaderEdit-obj_bccoaclass_id">

	<!-- Textbox: bccoaclass_id-->	
	<div id="bccoaclassHeaderEdit-obj_bccoaclass_id-container" class="input-field" field="bccoaclassHeaderEdit-obj_bccoaclass_id">
		<label for="bccoaclassHeaderEdit-obj_bccoaclass_id">ID</label>
		<input id="bccoaclassHeaderEdit-obj_bccoaclass_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="bccoaclass_id"
			data-tabindex="1" 
			required 
			invalid-message-required="ID harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: bccoaclass_name-->	
	<div id="bccoaclassHeaderEdit-obj_bccoaclass_name-container" class="input-field" field="bccoaclassHeaderEdit-obj_bccoaclass_name">
		<label for="bccoaclassHeaderEdit-obj_bccoaclass_name">Name</label>
		<input id="bccoaclassHeaderEdit-obj_bccoaclass_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="bccoaclass_name"
			data-tabindex="2" 
			character-case="uppercase" 
			required 
			invalid-message-required="nama harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>
	
</form>
