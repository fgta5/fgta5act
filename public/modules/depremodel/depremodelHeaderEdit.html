<form id="depremodelHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="depremodelHeaderEdit-obj_depremodel_id">

	<!-- Textbox: depremodel_id-->	
	<div id="depremodelHeaderEdit-obj_depremodel_id-container" class="input-field" field="depremodelHeaderEdit-obj_depremodel_id">
		<label for="depremodelHeaderEdit-obj_depremodel_id">ID</label>
		<input id="depremodelHeaderEdit-obj_depremodel_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="depremodel_id"
			data-tabindex="1" 
			required 
			invalid-message-required="id harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: depremodel_name-->	
	<div id="depremodelHeaderEdit-obj_depremodel_name-container" class="input-field" field="depremodelHeaderEdit-obj_depremodel_name">
		<label for="depremodelHeaderEdit-obj_depremodel_name">Name</label>
		<input id="depremodelHeaderEdit-obj_depremodel_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="depremodel_name"
			data-tabindex="2" 
			character-case="uppercase" 
			required 
			invalid-message-required="nama model depresiasi harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: formulaname-->	
	<div id="depremodelHeaderEdit-obj_formulaname-container" class="input-field" field="depremodelHeaderEdit-obj_formulaname">
		<label for="depremodelHeaderEdit-obj_formulaname">Formula Name</label>
		<input id="depremodelHeaderEdit-obj_formulaname"  fgta5-component="Textbox" placeholder="formula" autocomplete="off" spellcheck="false" 
			binding="formulaname"
			data-tabindex="3" 
			character-case="lowercase" 
			required 
			invalid-message-required="nama formula depresiassi harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>
	
</form>
