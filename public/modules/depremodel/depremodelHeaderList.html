<div id="depremodelHeaderList-header">
</div>

<div class="search-container">
	<div id="depremodelHeaderList-pnl_search" class="search-parameters">
		<input id="depremodelHeaderList-txt_searchtext" fgta5-component="Textbox" placeholder="search" autocomplete="off" spellcheck="false" binding="searchtext" data-searchinput>
	</div>
	<button id="depremodelHeaderList-btn_gridload">Load</button>
</div>

<table id="depremodelHeaderList-tbl" fgta5-component="Gridview">
	<thead>
		<tr data-header key="depremodel_id">
			<th data-name="depremodel_id" binding="depremodel_id" >ID</th>
			<th data-name="depremodel_name" binding="depremodel_name" >Name</th>
			<th data-name="formulaname" binding="formulaname" >Formula Name</th>
		</tr>
	</thead>
</table>



<div class="footer-buttons-container">
	<div></div>
	<div>
		<button id="depremodelHeaderList-btn_new" data-action="depremodelHeader-new" data-sectionsource="depremodelHeaderList-section">New</button>
	</div>
	<div></div>
</div>
