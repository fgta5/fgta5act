<form id="itemclasstypeHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="itemclasstypeHeaderEdit-obj_itemclasstype_id">

	<!-- Textbox: itemclasstype_id-->	
	<div id="itemclasstypeHeaderEdit-obj_itemclasstype_id-container" class="input-field" field="itemclasstypeHeaderEdit-obj_itemclasstype_id">
		<label for="itemclasstypeHeaderEdit-obj_itemclasstype_id">ID</label>
		<input id="itemclasstypeHeaderEdit-obj_itemclasstype_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="itemclasstype_id"
			data-tabindex="1" 
			required 
			invalid-message-required="ID harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: itemclasstype_name-->	
	<div id="itemclasstypeHeaderEdit-obj_itemclasstype_name-container" class="input-field" field="itemclasstypeHeaderEdit-obj_itemclasstype_name">
		<label for="itemclasstypeHeaderEdit-obj_itemclasstype_name">Name</label>
		<input id="itemclasstypeHeaderEdit-obj_itemclasstype_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="itemclasstype_name"
			data-tabindex="2" 
			character-case="uppercase" 
			required 
			invalid-message-required="nama tipe itemclass harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Combobox: itemmanage_id-->	
	<div id="itemclasstypeHeaderEdit-obj_itemmanage_id-container" class="input-field" field="itemclasstypeHeaderEdit-obj_itemmanage_id">

		<input id="itemclasstypeHeaderEdit-obj_itemmanage_id"  fgta5-component="Combobox" placeholder="manage as" autocomplete="off" spellcheck="false" 
			binding="itemmanage_id"
			data-tabindex="3" 
			data-display="itemmanage_name" 
		>
	</div>


	<!-- Textbox: itemclasstype_descr-->	
	<div id="itemclasstypeHeaderEdit-obj_itemclasstype_descr-container" class="input-field" field="itemclasstypeHeaderEdit-obj_itemclasstype_descr">

		<input id="itemclasstypeHeaderEdit-obj_itemclasstype_descr"  fgta5-component="Textbox" placeholder="descr" autocomplete="off" spellcheck="false" 
			binding="itemclasstype_descr"
			data-tabindex="4" 
			autocomplete="off" spellcheck="false" 
			maxlength="255" 
		>
	</div>


	<!-- Checkbox: ishasbscoa-->	
	<div id="itemclasstypeHeaderEdit-obj_ishasbscoa-container" class="input-field" field="itemclasstypeHeaderEdit-obj_ishasbscoa">
		<label for="itemclasstypeHeaderEdit-obj_ishasbscoa">BS COA</label>
		<input id="itemclasstypeHeaderEdit-obj_ishasbscoa"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="ishasbscoa"
			data-tabindex="5" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: ishasdeprecoa-->	
	<div id="itemclasstypeHeaderEdit-obj_ishasdeprecoa-container" class="input-field" field="itemclasstypeHeaderEdit-obj_ishasdeprecoa">
		<label for="itemclasstypeHeaderEdit-obj_ishasdeprecoa">Depre COA</label>
		<input id="itemclasstypeHeaderEdit-obj_ishasdeprecoa"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="ishasdeprecoa"
			data-tabindex="6" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: ishasdepremethod-->	
	<div id="itemclasstypeHeaderEdit-obj_ishasdepremethod-container" class="input-field" field="itemclasstypeHeaderEdit-obj_ishasdepremethod">
		<label for="itemclasstypeHeaderEdit-obj_ishasdepremethod">Depre Method</label>
		<input id="itemclasstypeHeaderEdit-obj_ishasdepremethod"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="ishasdepremethod"
			data-tabindex="7" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: ishasdeprecond-->	
	<div id="itemclasstypeHeaderEdit-obj_ishasdeprecond-container" class="input-field" field="itemclasstypeHeaderEdit-obj_ishasdeprecond">
		<label for="itemclasstypeHeaderEdit-obj_ishasdeprecond">Depre Condition</label>
		<input id="itemclasstypeHeaderEdit-obj_ishasdeprecond"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="ishasdeprecond"
			data-tabindex="8" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: ishasexpensecoa-->	
	<div id="itemclasstypeHeaderEdit-obj_ishasexpensecoa-container" class="input-field" field="itemclasstypeHeaderEdit-obj_ishasexpensecoa">

		<input id="itemclasstypeHeaderEdit-obj_ishasexpensecoa"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="ishasexpensecoa"
			data-tabindex="9" 
			type="checkbox" 
		>
	</div>
