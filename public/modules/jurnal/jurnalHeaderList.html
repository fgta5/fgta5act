<div class="search-container">
	<div id="jurnalHeaderList-pnl_search" class="search-parameters">
		<input id="jurnalHeaderList-txt_searchtext" fgta5-component="Textbox" placeholder="search" autocomplete="off" spellcheck="false" binding="searchtext" data-searchinput>
	</div>
	<button id="jurnalHeaderList-btn_gridload">Load</button>
</div>

<table id="jurnalHeaderList-tbl" fgta5-component="Gridview">
	<thead>
		<tr data-header key="jurnal_id">
			<th data-name="jurnal_id" binding="jurnal_id" style="display:none">ID</th>
			<th data-name="jurnal_doc" binding="jurnal_doc" >Doc.Id</th>
			<th data-name="jurnaltype_name" binding="jurnaltype_name" >Type</th>
			<th data-name="periode_name" binding="periode_name" >Periode</th>
			<th data-name="jurnal_date" binding="jurnal_date" formatter="dateshort(v)">Book Date</th>
			<th data-name="jurnal_datedue" binding="jurnal_datedue" formatter="dateshort(v)">Due Date</th>
			<th data-name="jurnal_descr" binding="jurnal_descr" >Descr</th>
			<th data-name="curr_code" binding="curr_code" >Currency</th>
			<th data-name="curr_rate" binding="curr_rate" formatter="decimal(v, 0)" style="text-align:right">Rate</th>
			<th data-name="jurnal_idr" binding="jurnal_idr" formatter="decimal(v, 2)" style="text-align:right">IDR</th>
			<th data-name="jurnal_value" binding="jurnal_value" formatter="decimal(v, 2)" style="text-align:right">Foreign</th>
			<th data-name="coa_name" binding="coa_name" >Coa</th>
			<th data-name="unit_name" binding="unit_name" >Unit</th>
			<th data-name="site_name" binding="site_name" >Site</th>
			<th data-name="dept_name" binding="dept_name" >Dept</th>
			<th data-name="partner_name" binding="partner_name" >Partner</th>
			<th data-name="project_name" binding="project_name" >Project</th>
			<th data-name="iscommit" binding="iscommit" formatter="checkmark(value)" style="text-align:center">Commit</th>
			<th data-name="ispost" binding="ispost" formatter="checkmark(value)" style="text-align:center">Posted</th>
		</tr>
	</thead>
</table>



<div class="footer-buttons-container">
	<div></div>
	<div>
		<button id="jurnalHeaderList-btn_new" data-action="jurnalHeader-new" data-sectionsource="jurnalHeaderList-section">New</button>
	</div>
	<div></div>
</div>
