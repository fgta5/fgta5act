<form id="itemclassHeaderEdit-frm" class="module-form" locked="true" autoid="true" primarykey="itemclassHeaderEdit-obj_itemclass_id">

	<!-- Textbox: itemclass_id-->	
	<div id="itemclassHeaderEdit-obj_itemclass_id-container" class="input-field" field="itemclassHeaderEdit-obj_itemclass_id">
		<label for="itemclassHeaderEdit-obj_itemclass_id">ID</label>
		<input id="itemclassHeaderEdit-obj_itemclass_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="itemclass_id"
			data-tabindex="1" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Combobox: itemclasstype_id-->	
	<div id="itemclassHeaderEdit-obj_itemclasstype_id-container" class="input-field" field="itemclassHeaderEdit-obj_itemclasstype_id">
		<label for="itemclassHeaderEdit-obj_itemclasstype_id">Type</label>
		<input id="itemclassHeaderEdit-obj_itemclasstype_id"  fgta5-component="Combobox" placeholder="itemclasstype_id" autocomplete="off" spellcheck="false" 
			binding="itemclasstype_id"
			data-tabindex="2" 
			required 
			invalid-message-required="tipe itemclass harus diisi" 
			data-display="itemclasstype_name" 
		>
	</div>


	<!-- Textbox: itemclass_name-->	
	<div id="itemclassHeaderEdit-obj_itemclass_name-container" class="input-field" field="itemclassHeaderEdit-obj_itemclass_name">
		<label for="itemclassHeaderEdit-obj_itemclass_name">Name</label>
		<input id="itemclassHeaderEdit-obj_itemclass_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="itemclass_name"
			data-tabindex="3" 
			required 
			invalid-message-required="nama itemclass harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="90" 
		>
	</div>


	<!-- Checkbox: itemclass_isdisabled-->	
	<div id="itemclassHeaderEdit-obj_itemclass_isdisabled-container" class="input-field" field="itemclassHeaderEdit-obj_itemclass_isdisabled">
		<label for="itemclassHeaderEdit-obj_itemclass_isdisabled">Disabled</label>
		<input id="itemclassHeaderEdit-obj_itemclass_isdisabled"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="itemclass_isdisabled"
			data-tabindex="4" 
			type="checkbox" 
		>
	</div>


	<!-- Combobox: dept_id-->	
	<div id="itemclassHeaderEdit-obj_dept_id-container" class="input-field" field="itemclassHeaderEdit-obj_dept_id">
		<label for="itemclassHeaderEdit-obj_dept_id">Dept</label>
		<input id="itemclassHeaderEdit-obj_dept_id"  fgta5-component="Combobox" placeholder="dept" autocomplete="off" spellcheck="false" 
			binding="dept_id"
			data-tabindex="5" 
			required 
			invalid-message-required="departemen owner harus diisi" 
			data-display="dept_name" 
		>
	</div>


	<!-- Textbox: itemmanage_id-->	
	<div id="itemclassHeaderEdit-obj_itemmanage_id-container" class="input-field" field="itemclassHeaderEdit-obj_itemmanage_id">
		<label for="itemclassHeaderEdit-obj_itemmanage_id">Manage</label>
		<input id="itemclassHeaderEdit-obj_itemmanage_id"  fgta5-component="Textbox" placeholder="manage" autocomplete="off" spellcheck="false" 
			binding="itemmanage_id"
			data-tabindex="6" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
			disabled 
		>
	</div>


	<!-- Combobox: bs_coa_id-->	
	<div id="itemclassHeaderEdit-obj_bs_coa_id-container" class="input-field" field="itemclassHeaderEdit-obj_bs_coa_id">
		<label for="itemclassHeaderEdit-obj_bs_coa_id">BS COA</label>
		<input id="itemclassHeaderEdit-obj_bs_coa_id"  fgta5-component="Combobox" placeholder="coa" autocomplete="off" spellcheck="false" 
			binding="bs_coa_id"
			data-tabindex="7" 
			data-display="bs_coa_name" 
		>
	</div>


	<!-- Combobox: depre_coa_id-->	
	<div id="itemclassHeaderEdit-obj_depre_coa_id-container" class="input-field" field="itemclassHeaderEdit-obj_depre_coa_id">
		<label for="itemclassHeaderEdit-obj_depre_coa_id">Amort COA</label>
		<input id="itemclassHeaderEdit-obj_depre_coa_id"  fgta5-component="Combobox" placeholder="coa" autocomplete="off" spellcheck="false" 
			binding="depre_coa_id"
			data-tabindex="8" 
			data-display="amort_coa_id" 
		>
	</div>


	<!-- Combobox: depremodel_id-->	
	<div id="itemclassHeaderEdit-obj_depremodel_id-container" class="input-field" field="itemclassHeaderEdit-obj_depremodel_id">
		<label for="itemclassHeaderEdit-obj_depremodel_id">Depre Model</label>
		<input id="itemclassHeaderEdit-obj_depremodel_id"  fgta5-component="Combobox" placeholder="model depresiasi" autocomplete="off" spellcheck="false" 
			binding="depremodel_id"
			data-tabindex="9" 
			data-display="depremodel_name" 
		>
	</div>


	<!-- Checkbox: directexpensecond-->	
	<div id="itemclassHeaderEdit-obj_directexpensecond-container" class="input-field" field="itemclassHeaderEdit-obj_directexpensecond">
		<label for="itemclassHeaderEdit-obj_directexpensecond">Direct Expense Condition</label>
		<input id="itemclassHeaderEdit-obj_directexpensecond"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="directexpensecond"
			data-tabindex="10" 
			type="checkbox" 
		>
	</div>


	<!-- Numberbox: bellowvalue-->	
	<div id="itemclassHeaderEdit-obj_bellowvalue-container" class="input-field" field="itemclassHeaderEdit-obj_bellowvalue">
		<label for="itemclassHeaderEdit-obj_bellowvalue">Bellow Value</label>
		<input id="itemclassHeaderEdit-obj_bellowvalue"  fgta5-component="Numberbox" placeholder="bellowvalue" autocomplete="off" spellcheck="false" 
			binding="bellowvalue"
			value="0" 
			data-tabindex="11" 
			maxlength="13" 
			min="0" 
		>
	</div>


	<!-- Combobox: expense_coa_id-->	
	<div id="itemclassHeaderEdit-obj_expense_coa_id-container" class="input-field" field="itemclassHeaderEdit-obj_expense_coa_id">
		<label for="itemclassHeaderEdit-obj_expense_coa_id">Expense COA</label>
		<input id="itemclassHeaderEdit-obj_expense_coa_id"  fgta5-component="Combobox" placeholder="coa" autocomplete="off" spellcheck="false" 
			binding="expense_coa_id"
			data-tabindex="12" 
			data-display="expense_coa_name" 
		>
	</div>
	
</form>


<div id="itemclassHeaderEdit-footer">
</div>

	</div>

		</div>
	</div>
</div>

	<div><a id="itemclassHeader-btn_logs" href="javascript:void(0)" tabindex="-1">Logs</a></div>
	<div><a id="itemclassHeader-btn_about" href="javascript:void(0)" tabindex="-1">About</a></div>

		<button id="itemclassHeaderEdit-btn_prev"><span>&laquo;&laquo;</span></button>
	</div>
	<div>
		<button id="itemclassHeaderEdit-btn_save">Save</button>
		<button id="itemclassHeaderEdit-btn_edit">Edit</button>
		<button id="itemclassHeaderEdit-btn_new" data-action="itemclassHeader-new">New</button>
		<button id="itemclassHeaderEdit-btn_reset">Reset</button>
		<button id="itemclassHeaderEdit-btn_delete">Delete</button>
	</div>
	<div>
		<button id="itemclassHeaderEdit-btn_next"><span>&raquo;&raquo;</span></button>
	</div>
</div>
