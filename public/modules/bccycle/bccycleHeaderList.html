<div id="bccycleHeaderList-header">
</div>

<div class="search-container">
	<div id="bccycleHeaderList-pnl_search" class="search-parameters">
		<input id="bccycleHeaderList-txt_searchtext" fgta5-component="Textbox" placeholder="search" autocomplete="off" spellcheck="false" binding="searchtext" data-searchinput>
	</div>
	<button id="bccycleHeaderList-btn_gridload">Load</button>
</div>

<table id="bccycleHeaderList-tbl" fgta5-component="Gridview">
	<thead>
		<tr data-header key="bccycle_id">
			<th data-name="bccycle_id" binding="bccycle_id" >ID</th>
			<th data-name="bccycle_name" binding="bccycle_name" >Name</th>
		</tr>
	</thead>
</table>



<div class="footer-buttons-container">
	<div></div>
	<div>
		<button id="bccycleHeaderList-btn_new" data-action="bccycleHeader-new" data-sectionsource="bccycleHeaderList-section">New</button>
	</div>
	<div></div>
</div>
