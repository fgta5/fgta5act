<form id="bccycleHeaderEdit-frm" class="module-form" locked="true" autoid="false" primarykey="bccycleHeaderEdit-obj_bccycle_id">

	<!-- Textbox: bccycle_id-->	
	<div id="bccycleHeaderEdit-obj_bccycle_id-container" class="input-field" field="bccycleHeaderEdit-obj_bccycle_id">
		<label for="bccycleHeaderEdit-obj_bccycle_id">ID</label>
		<input id="bccycleHeaderEdit-obj_bccycle_id"  fgta5-component="Textbox" placeholder="id" autocomplete="off" spellcheck="false" 
			binding="bccycle_id"
			data-tabindex="1" 
			required 
			invalid-message-required="id harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Textbox: bccycle_name-->	
	<div id="bccycleHeaderEdit-obj_bccycle_name-container" class="input-field" field="bccycleHeaderEdit-obj_bccycle_name">
		<label for="bccycleHeaderEdit-obj_bccycle_name">Name</label>
		<input id="bccycleHeaderEdit-obj_bccycle_name"  fgta5-component="Textbox" placeholder="name" autocomplete="off" spellcheck="false" 
			binding="bccycle_name"
			data-tabindex="2" 
			required 
			invalid-message-required="nama bussiness cycle harus diisi" 
			autocomplete="off" spellcheck="false" 
			maxlength="30" 
		>
	</div>


	<!-- Checkbox: isusecoaclass-->	
	<div id="bccycleHeaderEdit-obj_isuseclass-container" class="input-field" field="bccycleHeaderEdit-obj_isuseclass">
		<label for="bccycleHeaderEdit-obj_isuseclass">COA Class</label>
		<input id="bccycleHeaderEdit-obj_isuseclass"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="isusecoaclass"
			data-tabindex="3" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: isusecurr-->	
	<div id="bccycleHeaderEdit-obj_isusecurr-container" class="input-field" field="bccycleHeaderEdit-obj_isusecurr">
		<label for="bccycleHeaderEdit-obj_isusecurr">Curr</label>
		<input id="bccycleHeaderEdit-obj_isusecurr"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="isusecurr"
			data-tabindex="4" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: isuseapproval-->	
	<div id="bccycleHeaderEdit-obj_isuseapproval-container" class="input-field" field="bccycleHeaderEdit-obj_isuseapproval">
		<label for="bccycleHeaderEdit-obj_isuseapproval">Approval</label>
		<input id="bccycleHeaderEdit-obj_isuseapproval"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="isuseapproval"
			data-tabindex="5" 
			type="checkbox" 
		>
	</div>


	<!-- Checkbox: isusepaymreq-->	
	<div id="bccycleHeaderEdit-obj_isusepaymreq-container" class="input-field" field="bccycleHeaderEdit-obj_isusepaymreq">
		<label for="bccycleHeaderEdit-obj_isusepaymreq">Paym Req</label>
		<input id="bccycleHeaderEdit-obj_isusepaymreq"  fgta5-component="Checkbox" placeholder="" autocomplete="off" spellcheck="false" 
			binding="isusepaymreq"
			data-tabindex="6" 
			type="checkbox" 
		>
	</div>
	
</form>
